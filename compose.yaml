name: agent-workspace

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: agent_workspace
      POSTGRES_DB: agent_workspace
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.local}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent_workspace -d agent_workspace"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  postgres_data:
